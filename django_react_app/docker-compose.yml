services:
  django_app:
    container_name: django_app
    build:
      context: ./backend_cars
      dockerfile: Dockerfile
    command: >
      bash -c "gunicorn backend.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - static_volume:/home/backend/staticfiles
      - ./backend_cars/media:/home/backend/media
    expose: 
      - "8000"
    networks:
      - cars_network
  
  frontend_build:
    container_name: frontend_build
    build:
      context: ./frontend_cars
      dockerfile: Dockerfile
    volumes:
      - frontend_volume:/output
    networks:
      - cars_network
  
  nginx:
    container_name: nginx
    image: nginx:latest
    ports:
      - "8040:8040"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/home/backend/staticfiles
      - frontend_volume:/usr/share/nginx/html
      - ./backend_cars/media:/home/backend/media
    depends_on:
      django_app:
        condition: service_started
      frontend_build:
        condition: service_completed_successfully
    networks:
      - cars_network

volumes:
  static_volume:
    driver: local
  
  frontend_volume:
    driver: local

networks:
  cars_network:
    driver: bridge