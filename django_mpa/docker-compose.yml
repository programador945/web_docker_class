services:

  django:
    container_name: django_mpa

    build:
      context: ./app
      dockerfile: Dockerfile

    expose:
      - "8000"

    volumes:
      - ./app/db.sqlite3:/app/db.sqlite3
      - static_volume:/app/staticfiles
      - ./app/media:/app/media
    
    environment:
      - DJANGO_DEBUG=True
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1

    networks:
      - django_network

  nginx:
    container_name: nginx_mpa

    image: nginx:alpine

    ports:
      - "8080:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/staticfiles:ro
      - ./app/media:/app/media:ro

    depends_on:
      - django

    networks:
      - django_network

volumes:
  static_volume:

networks:
  django_network:
    driver: bridge